name: Fix Dahua HTTP Push

on:
  push:
    paths:
      - 'sitecustomize.py'
      - '.github/workflows/fix-dahua-push.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch staff bot HTTP receiver
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('staff_bot.py')
          text = path.read_text(encoding='utf-8')
          marker = 'DAHUA_NO_CONTENT_LENGTH_FIX_V2'
          if marker in text:
              print('Patch already installed')
              raise SystemExit(0)

          new_read_body = '''    def _read_body(self):
          transfer = self.headers.get("Transfer-Encoding", "")
          if "chunked" in transfer.lower():
              return self._read_chunked()
          try:
              length = int(self.headers.get("Content-Length", "0") or "0")
          except ValueError:
              length = 0
          if length:
              return self.rfile.read(length)

          # DAHUA_NO_CONTENT_LENGTH_FIX_V2
          # Some access controllers send POST data without Content-Length.
          # Read currently available bytes until a short socket timeout.
          chunks = []
          old_timeout = self.connection.gettimeout()
          try:
              self.connection.settimeout(0.35)
              while True:
                  try:
                      chunk = self.rfile.read1(65536)
                  except (TimeoutError, OSError):
                      break
                  if not chunk:
                      break
                  chunks.append(chunk)
                  if len(chunk) < 65536:
                      continue
          finally:
              try:
                  self.connection.settimeout(old_timeout)
              except Exception:
                  pass
          return b"".join(chunks)

'''

          text, n = re.subn(
              r'    def _read_body\(self\):\n.*?(?=    def do_POST\(self\):\n)',
              new_read_body,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('Could not locate _read_body')

          old_log = '''                "DAHUA POST path=%s content-type=%s transfer=%s body-bytes=%s",\n                path, content_type, self.headers.get("Transfer-Encoding", ""), len(raw)\n'''
          new_log = '''                "DAHUA POST path=%s content-type=%s transfer=%s content-length=%s body-bytes=%s",\n                path, content_type, self.headers.get("Transfer-Encoding", ""),\n                self.headers.get("Content-Length", ""), len(raw)\n'''
          if old_log not in text:
              raise SystemExit('Could not locate webhook log line')
          text = text.replace(old_log, new_log, 1)

          old_guard = '''            if "keepalive" in path.lower() or not raw:\n                self._reply(200, "OK")\n                return\n            payload = parse_body(raw, content_type)\n'''
          new_guard = '''            if "keepalive" in path.lower():\n                self._reply(200, "OK")\n                return\n            if raw:\n                payload = parse_body(raw, content_type)\n            else:\n                query = parse_qs(urlparse(self.path).query, keep_blank_values=True)\n                payload = {k: (v[-1] if v else "") for k, v in query.items()}\n                if not payload:\n                    self._reply(200, "OK")\n                    return\n'''
          if old_guard not in text:
              raise SystemExit('Could not locate webhook guard')
          text = text.replace(old_guard, new_guard, 1)

          path.write_text(text, encoding='utf-8')
          print('Dahua HTTP Push receiver patched')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staff_bot.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Dahua HTTP Push body without Content-Length'
          git push
