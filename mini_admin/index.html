<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#180d2d"><title>FUNLANDIA — Администратор</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#140d25;--card:#24183b;--line:#ffffff20;--muted:#bdb1ce;--gold:#ffd36e;--pink:#ff70a6;--cyan:#69d8f2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38204e,#140d25 55%);color:#fff;font:15px system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:18px 14px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-size:23px;font-weight:950;letter-spacing:2px}.brand span{color:var(--gold)}.sub{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat,.panel{background:#24183bdb;border:1px solid var(--line);border-radius:18px;padding:15px}.stat b{font-size:27px;display:block}.stat small{color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button,.btn{border:1px solid #8066a2;background:#34234d;color:white;padding:10px 13px;border-radius:12px;font-weight:700}.tabs button.active,.primary{background:#ffd36e;color:#241334;border-color:#ffd36e}.panel h2{font-size:18px;margin:0 0 12px}.request{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.request:last-child{border:0}.request button{background:transparent;border:0;color:#fff;text-align:left;font:inherit;cursor:pointer}.muted{color:var(--muted);font-size:12px}.status{font-size:11px;border-radius:20px;padding:5px 8px;background:#ffffff18;white-space:nowrap}.new{color:var(--gold)}.confirmed{color:#83e4ac}.rejected{color:#ff9292}.detail{line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none}.error{color:#ff9a9a;padding:12px}.empty{color:var(--muted);padding:20px 0}.back{margin-bottom:12px}.field{padding:8px 0;border-bottom:1px solid var(--line)}@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main>
<header class="top"><div><div class="brand">FUN<span>LANDIA</span></div><div class="sub">Панель администратора · тестовая версия</div></div><button class="btn" onclick="loadAll()">↻ Обновить</button></header>
<div id="denied" class="panel hidden">Откройте эту панель из Telegram под администраторским аккаунтом.</div>
<div id="app" class="hidden">
<section class="stats"><div class="stat"><b id="sToday">—</b><small>Заявок сегодня</small></div><div class="stat"><b id="sNew">—</b><small>Новые заявки</small></div><div class="stat"><b id="sConfirmed">—</b><small>Подтверждены</small></div><div class="stat"><b id="sTotal">—</b><small>Всего заявок</small></div></section>
<nav class="tabs"><button class="active" data-filter="today">Сегодня</button><button data-filter="new">Новые</button><button data-filter="all">Все заявки</button><button data-filter="bookings">📅 Календарь броней</button></nav>
<section class="panel" id="listPanel"><h2 id="listTitle">Заявки на сегодня</h2><div id="list"></div></section>
<section class="panel hidden" id="bookingPanel"><div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><h2 style="margin:0">Календарь дней рождения</h2><input id="bookingMonth" type="month" style="max-width:180px"></div><div id="bookingList" style="margin-top:12px"></div></section>
<section class="panel hidden" id="detailPanel"><button class="btn back" onclick="showList()">← К списку</button><h2 id="detailTitle">Заявка</h2><div id="detail" class="detail"></div><div id="actions" class="actions"></div></section>
<div id="message" class="muted" style="padding:12px 2px"></div></div></main>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const init=tg?.initData||"";let filter="today";
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{"content-type":"application/json","x-telegram-init-data":init,...opts.headers}});const d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка запроса");return d}
function statusLabel(s){return ({new:"🆕 Новая",confirmed:"✅ Подтверждена",rejected:"❌ Отклонена"})[s]||s}
function fmt(d){try{return new Date(d).toLocaleString("ru-RU",{timeZone:"Asia/Tashkent"})}catch{return d||"—"}}
async function loadAll(){try{const s=await api("/api/summary");sToday.textContent=s.today;sNew.textContent=s.new;sConfirmed.textContent=s.confirmed;sTotal.textContent=s.total;await loadList()}catch(e){denied.classList.remove("hidden");app.classList.add("hidden");denied.textContent=e.message}}
async function loadList(){if(filter==="bookings"){listPanel.classList.add("hidden");detailPanel.classList.add("hidden");bookingPanel.classList.remove("hidden");await loadBookings();return}bookingPanel.classList.add("hidden");listPanel.classList.remove("hidden");listTitle.textContent=({today:"Заявки, поступившие сегодня",new:"Новые заявки",all:"Все заявки"})[filter];const rows=await api("/api/requests?filter="+filter);list.innerHTML=rows.length?rows.map(r=>'<div class="request"><button onclick="openRequest('+r.id+')"><b>№'+r.id+' · '+esc(r.child_name)+'</b><div class="muted">'+esc(r.customer_name)+' · праздник: '+esc(r.requested_date)+' · '+fmt(r.created_at)+'</div></button><span class="status '+r.status+'">'+statusLabel(r.status)+'</span></div>').join(""):'<div class="empty">Заявок пока нет.</div>'}
function bookingStatus(s){return ({held:"⏳ Временная бронь",awaiting_payment:"💳 Ожидает аванс",awaiting_admin:"🆕 Ожидает администратора",confirmed:"✅ Подтверждена",rejected:"❌ Отклонена",cancelled:"Отменена",expired:"Истекла"})[s]||s}
async function loadBookings(){const month=bookingMonth.value;if(!month){bookingList.innerHTML='<div class="empty">Выберите месяц.</div>';return}try{const rows=await api("/api/bookings?month="+month);bookingList.innerHTML=rows.length?rows.map(r=>{const dt=new Date(r.starts_at);const day=dt.toLocaleDateString("ru-RU",{timeZone:"Asia/Tashkent",weekday:"long",day:"numeric",month:"long"});const time=dt.toLocaleTimeString("ru-RU",{timeZone:"Asia/Tashkent",hour:"2-digit",minute:"2-digit"});const end=new Date(r.ends_at).toLocaleTimeString("ru-RU",{timeZone:"Asia/Tashkent",hour:"2-digit",minute:"2-digit"});const actions=(r.status==="held"||r.status==="awaiting_admin")?'<button class="btn primary" data-booking-id="'+r.id+'" data-booking-status="confirmed">✓ Подтвердить</button><button class="btn" data-booking-id="'+r.id+'" data-booking-status="rejected">✕ Отклонить</button>':(r.status==="confirmed"?'<button class="btn" data-booking-id="'+r.id+'" data-booking-status="cancelled">Отменить бронь</button>':"");return '<div class="request" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>'+esc(day)+' · '+time+'–'+end+'</b><span class="status '+r.status+'">'+bookingStatus(r.status)+'</span></div><div class="muted" style="margin:6px 0">Код '+esc(r.public_code)+' · Зона №'+r.zone_no+' · Именинник: '+esc(r.child_name)+' · '+esc(r.customer_name)+' · '+esc(r.phone)+' · Детей: '+r.children_count+'</div><div class="actions">'+actions+'</div></div>'}).join(""):'<div class="empty">На этот месяц броней пока нет.</div>';bookingList.querySelectorAll("[data-booking-id]").forEach(b=>b.onclick=()=>changeBookingStatus(Number(b.dataset.bookingId),b.dataset.bookingStatus))}catch(e){bookingList.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function changeBookingStatus(id,status){try{await api("/api/bookings/"+id,{method:"PATCH",body:JSON.stringify({status})});message.textContent="Статус бронирования обновлён";await loadBookings();await loadAll()}catch(e){message.textContent=e.message}}
function esc(x){return String(x??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function openRequest(id){try{const r=await api("/api/requests/"+id);listPanel.classList.add("hidden");detailPanel.classList.remove("hidden");detailTitle.textContent="Заявка №"+r.id;const fields=[["Статус",statusLabel(r.status)],["Имя клиента",r.customer_name],["Именинник",r.child_name],["Возраст",r.child_age],["Дата праздника",r.requested_date],["Детей",r.children_count],["Взрослых",r.adults_count],["Телефон",r.phone],["Формат",r.celebration_format],["Пожелания",r.wishes],["Telegram",r.telegram_username?"@"+r.telegram_username:r.telegram_user_id],["Получена",fmt(r.created_at)]];detail.innerHTML=fields.map(([k,v])=>'<div class="field"><span class="muted">'+k+'</span><br><b>'+esc(v)+'</b></div>').join("");actions.innerHTML="";if(r.status!=="confirmed")actions.insertAdjacentHTML("beforeend",'<button class="btn primary" onclick="changeStatus('+id+',\'confirmed\')">✓ Подтвердить</button>');if(r.status!=="rejected")actions.insertAdjacentHTML("beforeend",'<button class="btn" onclick="changeStatus('+id+',\'rejected\')">✕ Отклонить</button>')}catch(e){message.textContent=e.message}}
async function changeStatus(id,status){try{await api("/api/requests/"+id,{method:"PATCH",body:JSON.stringify({status})});message.textContent="Статус заявки обновлён";await loadAll();await openRequest(id)}catch(e){message.textContent=e.message}}
function showList(){detailPanel.classList.add("hidden");listPanel.classList.remove("hidden")}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));filter=b.dataset.filter;showList();loadList()});
const now=new Date();bookingMonth.value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");bookingMonth.onchange=loadBookings;
if(init){app.classList.remove("hidden");loadAll()}else{denied.classList.remove("hidden")}
</script></body></html>
